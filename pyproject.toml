[project]
name = "evalrag"
version = "0.1.0"
description = "A from-scratch CLI evaluation framework for RAG pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
evalrag = "evalrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalrag"]
# Ship the default configs so a pip-installed evalrag has sane defaults to copy/point at.
force-include = { "configs" = "evalrag/configs" }

[tool.hatch.build]
# prompts live inside evalrag/ so they're included automatically; be explicit for sdist.
include = ["evalrag/**", "configs/**", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
