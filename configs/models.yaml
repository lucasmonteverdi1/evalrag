judge:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY   # names WHICH env var holds the key; value never in YAML
  model: google/gemini-2.5-flash
  temperature: 0                    # Reproducibility
  max_tokens: 1024
  timeout_seconds: 30
  max_retries: 3

# The pipeline-under-test generator model (set when running evaluations).
pipeline_generator:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-4o
  temperature: 0
  max_tokens: 512

# Response cache — all LLM calls keyed by (provider, model, prompt_version, inputs).
cache:
  enabled: true
  dir: .cache/llm_responses