name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the GitHub Release
  id-token: write  # needed for PyPI Trusted Publishing (OIDC), no token stored

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      # Gate: the release only proceeds if the same checks CI runs pass.
      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        # Trusted Publishing: PyPI trusts this workflow via OIDC — no API token.
        # Requires a one-time "trusted publisher" setup on pypi.org (see README).
        run: uv publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
